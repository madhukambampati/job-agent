<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-agent</title>
<style>
  :root {
    --ink: #14213d; --navy: #1F3864; --navy-2: #2c4a80; --muted: #5b6475; --line: #e3e6ec; --paper: #f5f4f0; --card: #fff;
    --green: #1f7a4d; --green-bg: #e3f3ea; --amber: #a86405; --amber-bg: #fdf1dc; --red: #b4232c; --red-bg: #fbe8e9;
    --blue: #1f5fbf; --blue-bg: #e7effc; --violet: #6440b8; --violet-bg: #efe9fb; --gold: #8a6a00; --gold-bg: #fbf3cf; --grey-bg: #eef0f3;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; font: 14.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; color: var(--ink); background: var(--paper); }
  a { color: var(--navy-2); }
  button { font: inherit; font-weight: 600; font-size: 13.5px; border: 1px solid var(--navy); background: #fff; color: var(--navy); border-radius: 8px; padding: 7px 13px; cursor: pointer; }
  button.primary { background: var(--navy); color: #fff; }
  button.ghost { border-color: transparent; color: var(--muted); font-weight: 500; }
  button.small { padding: 4px 10px; font-size: 12.5px; }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--ink); background: #fff; }
  textarea { width: 100%; min-height: 80px; resize: vertical; }

  .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100%; }
  nav.side { background: var(--navy); color: #dfe6f3; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
  nav.side .logo { color: #fff; font-weight: 700; font-size: 17px; padding: 4px 10px 16px; }
  nav.side a.nav { display: flex; align-items: center; gap: 10px; color: #dfe6f3; text-decoration: none; padding: 9px 10px; border-radius: 8px; font-weight: 500; }
  nav.side a.nav:hover { background: rgba(255,255,255,.08); }
  nav.side a.nav.on { background: rgba(255,255,255,.16); color: #fff; }
  nav.side .badge { margin-left: auto; background: #f2c94c; color: #3d2e00; font-size: 11.5px; font-weight: 700; border-radius: 99px; padding: 0 7px; }
  nav.side .meta { margin-top: auto; font-size: 12px; display: grid; gap: 6px; padding: 10px; border-top: 1px solid rgba(255,255,255,.15); }
  nav.side .meta a { color: #f2c94c; }
  main { min-width: 0; }
  .sandbar { background: #fff4ce; color: #5c4400; font-size: 13px; padding: 7px 24px; border-bottom: 1px solid #f0dfa0; }
  .sandbar a { color: inherit; font-weight: 700; }
  .view { padding: 22px 28px 60px; max-width: 1180px; }
  h1.title { font-size: 21px; margin: 0 0 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1.title .right { margin-left: auto; display: flex; gap: 8px; }
  .hint { color: var(--muted); font-size: 13px; }

  /* ---- Find ---- */
  form.search { display: flex; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 2px 10px rgba(20,33,61,.05); }
  form.search input { flex: 1; border: 0; outline: 0; padding: 10px 12px; font-size: 15px; }
  form.search.empty { border-color: var(--red); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
  .chips button { font-weight: 500; font-size: 13px; border-color: var(--line); color: var(--ink); border-radius: 99px; }
  .runline { margin: 16px 0 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
  .runline b { color: var(--ink); font-weight: 600; }
  .runline .right { margin-left: auto; }
  .progressbar { height: 4px; background: var(--grey-bg); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .progressbar > div { height: 100%; background: var(--navy-2); width: 0; transition: width .3s; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .card .top { display: flex; gap: 14px; align-items: flex-start; }
  .card h3 { margin: 0; font-size: 15.5px; line-height: 1.3; }
  .card .co { color: var(--muted); }
  .card .meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; background: var(--grey-bg); color: var(--muted); padding: 1px 6px; border-radius: 4px; }
  .summary { font-size: 13px; color: var(--muted); }
  details.why summary { cursor: pointer; font-size: 13px; color: var(--navy-2); font-weight: 600; list-style: none; }
  details.why summary::-webkit-details-marker { display: none; }
  details.why summary::before { content: "▸ "; } details.why[open] summary::before { content: "▾ "; }
  .why-body { font-size: 13px; display: grid; gap: 8px; margin-top: 6px; }
  .why-body h4 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .why-body ul { margin: 2px 0 0; padding-left: 18px; }
  .sev { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
  .sev.major, .sev.dealbreaker { color: var(--red); } .sev.minor { color: var(--amber); }
  .kind { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 1px 6px; border-radius: 4px; background: var(--blue-bg); color: var(--blue); margin-right: 4px; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
  .strip { font-size: 13px; padding: 8px 10px; border-radius: 8px; display: flex; align-items: center; gap: 8px; }
  .strip.run { background: var(--blue-bg); color: var(--blue); } .strip.ok { background: var(--green-bg); color: var(--green); }
  .strip.warn { background: var(--amber-bg); color: var(--amber); } .strip.bad { background: var(--red-bg); color: var(--red); } .strip.skip { background: var(--grey-bg); color: var(--muted); }
  .strip a { color: inherit; font-weight: 700; }

  /* ring */
  .ring { flex: none; position: relative; width: 52px; height: 52px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .n { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .ring .n small { font-size: 9px; font-weight: 600; color: var(--muted); display: block; line-height: 1; margin-top: -2px; text-align: center; }
  .ring.small { width: 34px; height: 34px; } .ring.small .n { font-size: 12px; }

  .spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; flex: none; opacity: .8; }
  @keyframes s { to { transform: rotate(360deg); } }

  /* ---- Applications ---- */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 8px 12px; font-weight: 600; }
  .tabs button.on { color: var(--navy); border-bottom-color: var(--navy); }
  .tabs .count { font-weight: 500; color: var(--muted); margin-left: 4px; font-size: 12px; }
  table.apps { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table.apps th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; padding: 10px 12px; background: #fafbfc; border-bottom: 1px solid var(--line); }
  table.apps td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.apps tr:last-child td { border-bottom: 0; }
  table.apps tr.row { cursor: pointer; } table.apps tr.row:hover td { background: #f8f9fb; }
  .doc { text-decoration: none; font-size: 13px; white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; white-space: nowrap; background: var(--grey-bg); color: var(--muted); }
  .pill.submitted, .pill.followed_up { background: var(--green-bg); color: var(--green); }
  .pill.needs, .pill.ready { background: var(--amber-bg); color: var(--amber); }
  .pill.ready { background: var(--blue-bg); color: var(--blue); }
  .pill.failed { background: var(--red-bg); color: var(--red); }
  .pill.live { background: var(--blue-bg); color: var(--blue); }
  .pill.interviewing { background: var(--violet-bg); color: var(--violet); }
  .pill.offer { background: var(--gold-bg); color: var(--gold); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .due { color: var(--amber); font-weight: 600; }
  .empty { padding: 40px; text-align: center; color: var(--muted); background: #fff; border: 1px dashed var(--line); border-radius: 12px; }

  /* ---- Needs you ---- */
  .needs { display: grid; gap: 12px; }
  .needs .card { flex-direction: row; align-items: center; gap: 16px; }
  .needs .card .body { flex: 1; min-width: 0; }
  .needs .reason { font-size: 13px; color: var(--amber); margin-top: 4px; }
  .needs .card.failed .reason { color: var(--red); }

  /* ---- Drawer ---- */
  .scrim { position: fixed; inset: 0; background: rgba(20,33,61,.28); z-index: 10; }
  aside.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100%); background: #fff; z-index: 11; box-shadow: -8px 0 30px rgba(20,33,61,.18); display: flex; flex-direction: column; }
  aside.drawer header { padding: 18px 22px 0; border-bottom: 1px solid var(--line); }
  aside.drawer header .row1 { display: flex; gap: 12px; align-items: flex-start; }
  aside.drawer header h2 { margin: 0; font-size: 18px; } aside.drawer header .co { color: var(--muted); }
  aside.drawer header .close { margin-left: auto; font-size: 18px; padding: 2px 10px; }
  aside.drawer .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  aside.drawer .bar input[type=text] { flex: 1 1 200px; }
  aside.drawer .tabs { margin: 0; border: 0; }
  aside.drawer .pane { padding: 18px 22px 40px; overflow: auto; flex: 1; }
  .md h1 { font-size: 18px; } .md h2 { font-size: 15px; margin: 16px 0 6px; } .md h3 { font-size: 13.5px; }
  .md table, .pane table.plain { border-collapse: collapse; width: 100%; font-size: 13px; }
  .md td, .md th, table.plain td, table.plain th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  .shot { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; }
  .diff .role { margin-bottom: 18px; } .diff .role h4 { margin: 0 0 6px; font-size: 13.5px; }
  .diff .b { padding: 6px 10px; border-left: 3px solid var(--line); margin: 4px 0; font-size: 13px; }
  .diff .b.rw { border-color: var(--green); background: #f6fbf8; } .diff .b.mv { border-color: var(--blue); }
  .diff .old { color: var(--muted); text-decoration: line-through; display: block; }
  .diff .badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--blue); margin-right: 6px; }
  .diff .badge.rw { color: var(--green); }
  .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .box { border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13px; }
  .box h4 { margin: 0 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .promise { background: var(--green-bg); color: var(--green); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
  .q { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .q.weak { border-color: var(--amber); background: #fffaf0; }
  .q .m { font-size: 12px; color: var(--muted); }
  .profile dl { display: grid; grid-template-columns: 220px 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
  .profile dt { color: var(--muted); }

  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; }
    nav.side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 8px; }
    nav.side .logo { padding: 6px 10px; } nav.side .meta { display: none; }
    .view { padding: 16px; } .twocol { grid-template-columns: 1fr; }
    table.apps .hide-sm { display: none; }
    .profile dl { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav class="side">
    <div class="logo">job-agent</div>
    <a class="nav" href="#find" data-v="find">🔎 Find</a>
    <a class="nav" href="#applications" data-v="applications">📋 Applications</a>
    <a class="nav" href="#needs" data-v="needs">✋ Needs you <span class="badge" id="needsBadge" hidden></span></a>
    <a class="nav" href="#profile" data-v="profile">👤 Profile</a>
    <div class="meta" id="meta"></div>
  </nav>
  <main>
    <div class="sandbar" id="sandbar" hidden></div>

    <!-- FIND -->
    <section class="view" id="v-find">
      <h1 class="title">Find roles</h1>
      <form class="search" id="searchForm"><input id="q" autocomplete="off" placeholder="e.g. SDET or QA automation jobs, remote in Canada"><button class="primary">Search</button></form>
      <div class="hint" id="searchErr" hidden style="color:var(--red);margin-top:6px">Type a role and a place, e.g. “SDET jobs remote in Canada”.</div>
      <div class="chips" id="chips">
        <button type="button">SDET or QA automation jobs, remote in Canada</button>
        <button type="button">AI evaluation / LLM quality roles, remote Canada</button>
        <button type="button">Senior QA engineer jobs in Toronto, hybrid</button>
      </div>
      <div id="results"></div>
    </section>

    <!-- APPLICATIONS -->
    <section class="view" id="v-applications" hidden>
      <h1 class="title">Applications <span class="right"><button id="submitAll" class="primary" hidden></button></span></h1>
      <div class="tabs" id="appTabs"></div>
      <div id="appTable"></div>
    </section>

    <!-- NEEDS YOU -->
    <section class="view" id="v-needs" hidden>
      <h1 class="title">Needs you</h1>
      <p class="hint" style="margin-top:-6px">The agent stopped on these instead of guessing: a captcha, a question your profile can't answer truthfully, an Ashby form, or an error.</p>
      <div class="needs" id="needsList"></div>
    </section>

    <!-- PROFILE -->
    <section class="view profile" id="v-profile" hidden>
      <h1 class="title">Profile</h1>
      <div id="profileBody"></div>
    </section>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const localDay = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
let CFG = { threshold: 7 };
let APPS = { rows: [], active: [] };

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function get(path) {
  const r = await fetch(path);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function listen(id, on) {
  const es = new EventSource(`/api/stream/${id}/events`);
  es.onmessage = (m) => { const ev = JSON.parse(m.data); on(ev); if (["end", "error", "result", "ledger", "say"].includes(ev.type)) es.close(); };
  es.onerror = () => es.close();
}

// ---------- shared bits ----------
function ring(score, small = false) {
  const size = small ? 34 : 52, r = small ? 14 : 22, c = 2 * Math.PI * r, w = small ? 4 : 5;
  if (score == null) return `<div class="ring ${small ? "small" : ""}"><svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#eef0f3" stroke-width="${w}"/></svg><div class="n" style="color:var(--muted)">–</div></div>`;
  const color = score >= CFG.threshold ? "#1f7a4d" : score >= 5 ? "#c77d0a" : "#9aa1ad";
  return `<div class="ring ${small ? "small" : ""}" title="Fit ${score}/10"><svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#eef0f3" stroke-width="${w}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${(c * score) / 10} ${c}"/></svg><div class="n" style="color:${color}"><span>${score}${small ? "" : "<small>/10</small>"}</span></div></div>`;
}
const LIVE = [
  [/Queued/, "Queued"], [/Reading/, "Reading posting"], [/Scoring/, "Scoring fit"], [/Tailoring/, "Tailoring résumé"],
  [/Rendering/, "Building PDFs"], [/Opening/, "Opening form"], [/Answering/, "Answering questions"],
  [/Filling field (\d+) of (\d+)/, (m) => `Filling form ${m[1]}/${m[2]}`], [/Submitting/, "Submitting"], [/Starting/, "Starting"],
];
function liveLabel(step) {
  for (const [re, l] of LIVE) { const m = re.exec(step || ""); if (m) return typeof l === "function" ? l(m) : l; }
  return step || "Working";
}
const STATUS = {
  applied: ["submitted", "Submitted"], followed_up: ["followed_up", "Followed up"], interviewing: ["interviewing", "Interview"], offer: ["offer", "Offer"],
  rejected: ["", "Rejected"], withdrawn: ["", "Withdrawn"], needs_manual: ["needs", "Needs you"], failed: ["failed", "Failed"], skipped: ["", "Skipped"], ready: ["ready", "Ready to submit"],
};
function pill(status, active) {
  if (active) return `<span class="pill live"><span class="dot"></span>${esc(liveLabel(active.step))}</span>`;
  const [cls, label] = STATUS[status] || ["", status];
  return `<span class="pill ${cls}">${esc(label)}</span>`;
}
const activeFor = (key) => APPS.active.find((a) => a.key === key);
const fileUrl = (key, name) => `/api/file/${encodeURIComponent(key)}/${encodeURIComponent(name)}`;
function md(src) {
  if (!src) return '<p class="hint">Nothing here yet.</p>';
  const lines = esc(src).split("\n");
  let html = "", inList = false, table = [];
  const inline = (x) => x.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\s)_(.+?)_(?=\s|$)/g, "$1<i>$2</i>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flush = () => { if (!table.length) return; const rows = table.filter((r) => !/^\|[-| ]+\|$/.test(r.trim())); html += "<table>" + rows.map((r, i) => "<tr>" + r.trim().replace(/^\||\|$/g, "").split("|").map((c) => (i ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`)).join("") + "</tr>").join("") + "</table>"; table = []; };
  for (const l of lines) {
    if (l.trim().startsWith("|")) { table.push(l); continue; } else flush();
    const li = /^\s*(?:[-*]|\d+\.)\s+(.*)/.exec(l);
    if (li) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    const h = /^(#{1,3})\s+(.*)/.exec(l);
    if (h) html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; else if (l.trim()) html += `<p>${inline(l)}</p>`;
  }
  flush(); if (inList) html += "</ul>";
  return `<div class="md">${html}</div>`;
}
function whyBody(f) {
  const kinds = { "surface-existing": "Show it", learn: "Learn", "build-proof": "Build proof" };
  return `<div class="why-body">
    ${f.strengths?.length ? `<div><h4>Strengths</h4><ul>${f.strengths.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div>` : ""}
    ${f.gaps?.length ? `<div><h4>Gaps</h4><ul>${f.gaps.map((g) => `<li><span class="sev ${esc(g.severity)}">${esc(g.severity)}</span> ${esc(g.requirement)}</li>`).join("")}</ul></div>` : ""}
    ${f.plan?.length ? `<div><h4>To reach 8</h4><ul>${f.plan.map((p) => `<li><span class="kind">${esc(kinds[p.kind] || p.kind)}</span>${esc(p.gap)}: ${esc(p.action)}</li>`).join("")}</ul></div>` : ""}
  </div>`;
}

// ---------- routing ----------
function show(view) {
  if (!["find", "applications", "needs", "profile"].includes(view)) view = "find";
  $$(".view").forEach((v) => (v.hidden = v.id !== `v-${view}`));
  $$("nav a.nav").forEach((a) => a.classList.toggle("on", a.dataset.v === view));
  if (view === "applications") renderApps();
  if (view === "needs") renderNeeds();
  if (view === "profile") renderProfile();
}
window.addEventListener("hashchange", () => show(location.hash.slice(1)));

// ---------- config / header ----------
async function loadConfig() {
  CFG = await get("/api/config");
  $("#meta").innerHTML = [
    CFG.name && `<div>${esc(CFG.name)}</div>`,
    `<div>Applied today ${CFG.appliedToday}/${CFG.dailyCap}</div>`,
    `<div>Apply-to-all at fit ≥ ${CFG.threshold}</div>`,
    !CFG.hasKey && `<div style="color:#ffb4b4">No API key in .env</div>`,
    CFG.problem && `<div style="color:#ffb4b4" title="${esc(CFG.problem)}">Profile problem</div>`,
    CFG.sandbox && `<a href="${esc(CFG.sandbox.inboxUrl)}" target="_blank" rel="noopener">Sandbox employer inbox ↗</a>`,
  ].filter(Boolean).join("");
  if (CFG.sandbox) {
    $("#sandbar").hidden = false;
    $("#sandbar").innerHTML = `<b>Sandbox:</b> dummy jobs and dummy employer forms. Apply really fills and submits, but only to this computer. Brain: ${esc(CFG.sandbox.mode)}. <a href="${esc(CFG.sandbox.inboxUrl)}" target="_blank" rel="noopener">See what employers received ↗</a>`;
  }
}

// ---------- FIND ----------
$("#searchForm").onsubmit = (e) => { e.preventDefault(); search($("#q").value.trim()); };
$$("#chips button").forEach((b) => (b.onclick = () => { $("#q").value = b.textContent; search(b.textContent); }));
$("#q").addEventListener("input", () => { $("#searchErr").hidden = true; $("#searchForm").classList.remove("empty"); });

let RESULTS = new Map();
async function search(text) {
  if (!text) { $("#searchErr").hidden = false; $("#searchForm").classList.add("empty"); $("#q").focus(); return; }
  RESULTS = new Map();
  const box = $("#results");
  box.innerHTML = `<div class="runline"><span class="spin" style="color:var(--navy-2)"></span><span id="runText">Understanding your request…</span><span class="right" id="runCount"></span></div><div class="progressbar"><div id="bar"></div></div><div class="hint" id="understood"></div><div class="runline" id="bulkRow" hidden></div><div class="grid" id="grid"></div>`;
  let scored = 0, ended = false;
  const count = () => {
    const n = RESULTS.size;
    $("#runCount").innerHTML = n ? `<b>${n}</b> found · <b>${scored}</b> of ${n} scored` : "";
    $("#bar").style.width = n ? `${Math.round((scored / n) * 100)}%` : "8%";
  };
  try {
    const { id } = await post("/api/chat", { message: text });
    listen(id, (ev) => {
      if (ev.type === "query") {
        const q = ev.data;
        if (q.intent === "search") $("#understood").innerHTML = `Looking for <b>${esc(q.titles.slice(0, 5).join(", "))}${q.titles.length > 5 ? "…" : ""}</b> · <b>${esc([...q.places, q.country].filter(Boolean).join(", ") || "any location")}</b> · <b>${esc(q.workplace)}</b>`;
      } else if (ev.type === "status") { $("#runText").textContent = ev.data; }
      else if (ev.type === "job") { const c = card(ev.data); RESULTS.set(ev.data.id, { ...ev.data, el: c }); $("#grid").appendChild(c); count(); }
      else if (ev.type === "fit" || ev.type === "fit_error") {
        const j = RESULTS.get(ev.data.id); if (!j) return;
        scored++; count();
        ev.type === "fit" ? setFit(j, ev.data) : fitFailed(j, ev.data.error);
      } else if (ev.type === "ledger") { location.hash = "#applications"; }
      else if (ev.type === "say") { $("#runText").textContent = ev.data; $(".runline .spin")?.remove(); }
      else if (ev.type === "error") { $("#runText").innerHTML = `<span style="color:var(--red)">${esc(ev.data)}</span>`; $(".runline .spin")?.remove(); }
      else if (ev.type === "end") {
        ended = true; $(".runline .spin")?.remove(); $("#bar").style.width = "100%";
        for (const j of RESULTS.values()) if (j.fit === undefined && !j.fitFailed) fitFailed(j, "no answer");
        if (!RESULTS.size) { $("#runText").textContent += " Try widening it: drop the city, or add another title."; return; }
        renderBulk();
      }
    });
  } catch (err) { $("#runText").innerHTML = `<span style="color:var(--red)">${esc(err.message)}</span>`; }
}

function renderBulk() {
  const good = [...RESULTS.values()].filter((j) => (j.fit ?? 0) >= CFG.threshold && !j.applying && !j.done);
  const row = $("#bulkRow");
  row.hidden = false;
  row.innerHTML = good.length
    ? `<button class="primary" id="bulk">Apply to all with fit ≥ ${CFG.threshold} (${good.length})</button><span>Each one is tailored and submitted in order. Watch progress on the cards or in Applications.</span>`
    : `<span>No role scored ${CFG.threshold}+ yet. You can still Apply to any card yourself.</span>`;
  $("#bulk")?.addEventListener("click", () => {
    if (!confirm(`Tailor and submit ${good.length} application(s) now?`)) return;
    good.forEach((j) => apply(j, "submit", false));
    renderBulk();
  });
}

function card(j) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="top"><div class="ringwrap">${ring(null)}</div>
      <div style="min-width:0"><h3>${esc(j.title)}</h3><div class="co">${esc(j.company)}</div>
      <div class="meta"><span>📍 ${esc(j.location || "—")}</span>${j.compensation ? `<span>💰 ${esc(j.compensation)}</span>` : ""}<span class="tag">${esc(j.ats)}</span></div></div></div>
    <div class="summary"><span class="spin" style="display:inline-block;vertical-align:-2px;color:var(--muted)"></span> Checking fit…</div>
    <details class="why" hidden><summary>Why this score</summary><div class="whyb"></div></details>
    <div class="actions">
      <button class="primary" data-a="submit" disabled>Apply</button>
      <button data-a="dry" disabled title="Fill the form and screenshot it without submitting">Dry run</button>
      <a class="hint" href="${esc(j.url)}" target="_blank" rel="noopener" style="margin-left:auto">Posting ↗</a>
    </div>
    <div class="stripwrap"></div>`;
  $$("button[data-a]", el).forEach((b) => (b.onclick = () => apply(RESULTS.get(j.id), b.dataset.a, true)));
  return el;
}
function enable(j) { if (!j.applying) $$("button[data-a]", j.el).forEach((b) => (b.disabled = false)); }
function setFit(j, f) {
  j.fit = f.score; j.fitData = f; j.fitFailed = false;
  $(".ringwrap", j.el).innerHTML = ring(f.score);
  $(".summary", j.el).innerHTML = esc(f.summary) + (f.score < f.threshold ? ` <b>Below ${f.threshold}: Apply-to-all skips it, but you can Apply here.</b>` : "");
  const why = $(".why", j.el); why.hidden = false; $(".whyb", why).innerHTML = whyBody(f);
  enable(j);
  if ($("#bulkRow") && !$("#bulkRow").hidden) renderBulk();
}
function fitFailed(j, why) {
  j.fitFailed = true;
  $(".summary", j.el).innerHTML = `Fit check failed (${esc(why)}). <button type="button" class="small ghost retry">Retry</button> Apply still works: it scores the role first.`;
  $(".retry", j.el).onclick = async (e) => {
    e.target.disabled = true;
    $(".summary", j.el).innerHTML = '<span class="spin" style="display:inline-block;vertical-align:-2px"></span> Checking fit…';
    try { setFit(j, await post("/api/fit", { url: j.url })); } catch (err) { fitFailed(j, err.message); }
  };
  enable(j);
}
function strip(j, cls, html) { $(".stripwrap", j.el).innerHTML = `<div class="strip ${cls}">${html}</div>`; }

function apply(j, mode, manual) {
  j.applying = true;
  $$("button[data-a]", j.el).forEach((b) => (b.disabled = true));
  strip(j, "run", `<span class="spin"></span><span class="st">${mode === "dry" ? "Dry run queued" : "Queued"}</span>`);
  post("/api/apply", { url: j.url, mode, manual }).then(({ id }) => {
    refreshApps();
    listen(id, (ev) => {
      if (ev.type === "status") { const st = $(".st", j.el); if (st) st.textContent = liveLabel(ev.data) + (/Filling field/.test(ev.data) ? "" : "…"); }
      if (ev.type === "error") { j.applying = false; strip(j, "bad", `✗ ${esc(ev.data)}`); enable(j); }
      if (ev.type === "result") {
        const r = ev.data, open = `<a href="#applications" data-open="${esc(r.key)}">view application</a>`;
        const inbox = CFG.sandbox ? ` · <a href="${esc(CFG.sandbox.inboxUrl)}" target="_blank" rel="noopener">employer inbox ↗</a>` : "";
        const m = {
          applied: ["ok", `✓ Submitted. Fit ${r.score}/10. ${open}${inbox}`],
          ready: ["warn", `${/^Dry run/.test(r.reason) ? "Form filled (dry run), not submitted." : `Not submitted: ${esc(r.reason)}.`} ${open}`],
          needs_manual: ["warn", `Needs you: ${esc(r.reason)} · <a href="${esc(r.applyUrl)}" target="_blank" rel="noopener">finish by hand ↗</a> · ${open}`],
          skipped: ["skip", `Skipped: ${esc(r.reason)}`],
          failed: ["bad", `✗ ${esc(r.reason)} · ${open}`],
        }[r.status] || ["warn", esc(r.reason)];
        strip(j, m[0], m[1]);
        j.applying = false; j.done = r.status === "applied";
        if (!j.done) enable(j);
        loadConfig(); refreshApps();
      }
    });
  }).catch((e) => { j.applying = false; strip(j, "bad", esc(e.message)); enable(j); });
}

// ---------- APPLICATIONS ----------
const TABS = [
  ["all", "All", () => true],
  ["flight", "In flight", (r) => r.active || r.status === "ready"],
  ["needs", "Needs you", (r) => r.status === "needs_manual"],
  ["submitted", "Submitted", (r) => ["applied", "followed_up", "interviewing", "offer"].includes(r.status)],
  ["failed", "Failed", (r) => r.status === "failed"],
  ["skipped", "Skipped", (r) => r.status === "skipped"],
];
let appTab = "all";
let pollTimer = null;
async function refreshApps() {
  try { APPS = await get("/api/applications"); } catch { return; }
  const n = APPS.rows.filter((r) => ["needs_manual", "failed"].includes(r.status)).length;
  $("#needsBadge").hidden = !n; $("#needsBadge").textContent = n;
  if (!$("#v-applications").hidden) renderApps();
  if (!$("#v-needs").hidden) renderNeeds();
  clearTimeout(pollTimer);
  pollTimer = setTimeout(refreshApps, APPS.active.length ? 1500 : 15000);
}
function allRows() {
  const keyed = new Set(APPS.rows.map((r) => r.key));
  const pending = APPS.active.filter((a) => !a.key || !keyed.has(a.key)).map((a) => ({ key: a.key || a.id, company: a.company || "…", title: a.title || a.url, status: "queued", score: null, active: a, pending: true }));
  return [...pending, ...APPS.rows.map((r) => ({ ...r, active: activeFor(r.key) }))];
}
function renderApps() {
  const rows = allRows();
  $("#appTabs").innerHTML = TABS.map(([k, l, f]) => `<button class="${k === appTab ? "on" : ""}" data-t="${k}">${l}<span class="count">${rows.filter(f).length}</span></button>`).join("");
  $$("#appTabs button").forEach((b) => (b.onclick = () => { appTab = b.dataset.t; renderApps(); }));
  const ready = APPS.rows.filter((r) => r.status === "ready" && !activeFor(r.key));
  const sa = $("#submitAll");
  sa.hidden = !ready.length;
  sa.textContent = `Submit all ready (${ready.length})`;
  sa.onclick = () => {
    if (!confirm(`Submit ${ready.length} prepared application(s)?`)) return;
    ready.forEach((r) => post("/api/apply", { url: r.url, mode: "submit", manual: true }));
    setTimeout(refreshApps, 300);
  };
  const shown = rows.filter(TABS.find((t) => t[0] === appTab)[2]);
  if (!shown.length) { $("#appTable").innerHTML = `<div class="empty">${rows.length ? "Nothing in this tab." : 'No applications yet. Go to <a href="#find">Find</a> and click Apply on a role.'}</div>`; return; }
  const today = localDay();
  $("#appTable").innerHTML = `<table class="apps"><thead><tr><th>Role</th><th>Fit</th><th class="hide-sm">Résumé</th><th class="hide-sm">Cover letter</th><th>Status</th><th class="hide-sm">Updated</th><th>Next step</th></tr></thead><tbody>${shown.map((r) => {
    const due = r.nextStepDate && r.nextStepDate <= today && !["rejected", "withdrawn", "skipped", "applied"].includes(r.status);
    return `<tr class="row" data-key="${esc(r.key)}" ${r.pending ? 'data-pending="1"' : ""}>
      <td><b>${esc(r.company)}</b><div class="hint">${esc(r.title)}${r.location ? ` · ${esc(r.location)}` : ""}</div></td>
      <td>${ring(r.score, true)}</td>
      <td class="hide-sm">${r.resumePdf ? `<a class="doc" href="${fileUrl(r.key, r.resumePdf)}" target="_blank" onclick="event.stopPropagation()">📄 Tailored</a>` : '<span class="hint">—</span>'}</td>
      <td class="hide-sm">${r.coverPdf ? `<a class="doc" href="${fileUrl(r.key, r.coverPdf)}" target="_blank" onclick="event.stopPropagation()">📄 Letter</a>` : '<span class="hint">—</span>'}</td>
      <td>${pill(r.status, r.active)}${r.claimsRemoved ? `<div class="hint" title="Claims the honesty guard removed">🛡 ${r.claimsRemoved} removed</div>` : ""}</td>
      <td class="hide-sm hint">${r.updatedAt ? localDay(new Date(r.updatedAt)) : ""}</td>
      <td style="max-width:260px">${esc((r.nextStep || "").slice(0, 80))}${r.nextStepDate ? `<div class="${due ? "due" : "hint"}">${due ? "Due " : ""}${esc(r.nextStepDate)}</div>` : ""}</td></tr>`;
  }).join("")}</tbody></table>`;
  $$("#appTable tr.row").forEach((tr) => (tr.onclick = () => !tr.dataset.pending && openDrawer(tr.dataset.key)));
}

// ---------- NEEDS YOU ----------
function renderNeeds() {
  const rows = APPS.rows.filter((r) => ["needs_manual", "failed"].includes(r.status));
  if (!rows.length) { $("#needsList").innerHTML = '<div class="empty">Nothing needs you right now.</div>'; return; }
  $("#needsList").innerHTML = rows.map((r) => `<div class="card ${r.status === "failed" ? "failed" : ""}" data-key="${esc(r.key)}">
    ${ring(r.score, true)}
    <div class="body"><b>${esc(r.company)}</b> · ${esc(r.title)} ${pill(r.status, activeFor(r.key))}
      <div class="reason">${esc((r.notes || r.nextStep || "").split(" | ")[0])}</div></div>
    <div class="actions" style="margin:0">
      <a href="${esc(r.applyUrl)}" target="_blank" rel="noopener"><button type="button">Finish by hand ↗</button></a>
      <button type="button" data-do="retry">Retry</button>
      <button type="button" data-do="done">Mark as applied</button>
      <button type="button" class="ghost" data-do="open">Details</button>

}

// ---------- DRAWER ----------
let DR = null;
const spar = {};
async function openDrawer(key, tab = "overview") {
  try { DR = { key, tab, data: await get(`/api/job/${encodeURIComponent(key)}`) }; } catch (e) { alert(e.message); return; }
  $("#scrim").hidden = false; $("#drawer").hidden = false;
  renderDrawer();
}
function closeDrawer() { $("#scrim").hidden = true; $("#drawer").hidden = true; DR = null; }
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", (e) => e.key === "Escape" && closeDrawer());

function renderDrawer() {
  const { row, fit, edit } = DR.data, appRow = APPS.rows.find((x) => x.key === row.key) || row;
  const ev = DR.data.evidence?.matches || [];
  const tabs = [["overview", "Overview"], ["evidence", `Evidence${ev.length ? ` (${ev.filter((m) => m.supported).length}/${ev.length})` : ""}`], ["honesty", `Honesty${edit?.rejected?.length ? ` (${edit.rejected.length})` : ""}`], ["diff", "Résumé changes"], ["prep", "Interview prep"], ["briefing", "Briefing"], ["cover", "Cover note"], ["form", "Form"]];
  const canSubmit = ["ready", "needs_manual", "failed", "skipped"].includes(row.status);
  $("#drawer").innerHTML = `<header>
    <div class="row1">${ring(row.score)}<div><h2>${esc(row.title)}</h2><div class="co">${esc(row.company)} · ${pill(row.status, activeFor(row.key))} · <a href="${esc(row.url)}" target="_blank" rel="noopener">posting ↗</a></div></div><button class="ghost close" id="dClose" aria-label="Close">✕</button></div>
    <div class="bar">
      ${canSubmit ? `<button class="primary" id="dSubmit">${row.status === "ready" ? "Submit now" : "Try again"}</button>` : ""}
      ${["needs_manual", "failed", "ready"].includes(row.status) ? `<a href="${esc(appRow.applyUrl || row.url)}" target="_blank" rel="noopener"><button type="button">Finish by hand ↗</button></a>` : ""}
      <select id="dSt">${Object.keys(STATUS).map((s) => `<option value="${s}" ${s === row.status ? "selected" : ""}>${STATUS[s][1]}</option>`).join("")}</select>
      <input type="text" id="dNext" value="${esc(row.nextStep)}" placeholder="Next step"><input type="date" id="dDate" value="${esc(row.nextStepDate || "")}">
      <button id="dSave">Save</button>
    </div>
    <div class="tabs">${tabs.map(([k, l]) => `<button class="${k === DR.tab ? "on" : ""}" data-t="${k}">${l}</button>`).join("")}</div>
  </header><div class="pane" id="dPane"></div>`;
  $("#dClose").onclick = closeDrawer;
  $$("#drawer .tabs button").forEach((b) => (b.onclick = () => { DR.tab = b.dataset.t; renderDrawer(); }));
  $("#dSave").onclick = async () => { await post(`/api/ledger/${encodeURIComponent(row.key)}`, { status: $("#dSt").value, nextStep: $("#dNext").value, nextStepDate: $("#dDate").value }); await refreshApps(); openDrawer(row.key, DR.tab); };
  $("#dSubmit")?.addEventListener("click", async () => { await post("/api/apply", { url: row.url, mode: "submit", manual: true }); closeDrawer(); location.hash = "#applications"; refreshApps(); });
  renderPane();
}

      ${un.length ? `<ul>${un.map((u) => `<li>${esc(u)}</li>`).join("")}</ul><p class="hint">Be ready to talk about these honestly in an interview. The “To reach 8” plan in Overview has ideas.</p>` : '<p class="hint">None flagged.</p>'}`;
  } else if (DR.tab === "diff") {
    p.innerHTML = '<p class="hint">Loading…</p>';
    try {
      const x = await get(`/api/job/${encodeURIComponent(key)}/diff`);
      const changed = x.roles.reduce((n, r) => n + r.bullets.filter((b) => b.rewritten || b.from !== b.to).length, 0);
      p.innerHTML = `<div class="diff"><p class="hint">${changed} bullet change(s). Green = reworded (only with words already on your résumé), blue = moved up for this role.</p>
        <div class="twocol" style="margin-bottom:16px"><div class="box"><h4>Summary · before</h4>${esc(x.summary.before)}</div><div class="box"><h4>Summary · tailored</h4>${esc(x.summary.after)}</div></div>
        ${x.roles.map((r) => `<div class="role"><h4>${esc(r.heading)}</h4>${r.bullets.map((b) => `<div class="b ${b.rewritten ? "rw" : b.from !== b.to ? "mv" : ""}">${b.rewritten ? '<span class="badge rw">reworded</span>' : ""}${b.from !== b.to ? `<span class="badge">moved ${b.from + 1} → ${b.to + 1}</span>` : ""}${b.rewritten ? `<span class="old">${esc(b.original)}</span>` : ""}${esc(b.text)}</div>`).join("")}</div>`).join("")}</div>`;

    p.innerHTML = (d.answers?.length ? `<table class="plain"><tr><th>Field</th><th>Value</th><th>Source</th><th></th></tr>${d.answers.map((a) => `<tr><td>${esc(a.label)}${a.required ? " *" : ""}</td><td>${esc(a.value ?? "")}</td><td>${esc(a.source)}</td><td>${a.filled ? "✓" : "✗"}</td></tr>`).join("")}</table>` : '<p class="hint">The form was not opened for this role.</p>') + shots.map((s) => `<a href="${fileUrl(key, s)}" target="_blank"><img class="shot" src="${fileUrl(key, s)}" alt="${esc(s)}"></a>`).join("");
  } else if (DR.tab === "prep") renderPrep(p);
}

function renderPrep(p) {
  const qs = DR.data.questions?.questions;
  if (!qs) { p.innerHTML = '<p class="hint">No questions for this role (it was skipped before prep).</p>'; return; }
  const st = (spar[DR.key] ??= qs.map((q) => ({ q: q.question, history: "", grade: null, followUp: null })));
  const graded = st.filter((s) => s.grade);
  const weakest = graded.length ? graded.reduce((m, s) => (s.grade.score < m.grade.score ? s : m)) : null;
  p.innerHTML = `<p class="hint">Answer the way you would out loud. Each answer is scored; the weakest one is highlighted and keeps getting follow-ups until it reaches 8. The Briefing tab has the company background.</p>` +
    st.map((s, i) => `<div class="q ${s === weakest && s.grade.score < 8 ? "weak" : ""}">
      <div class="m">Q${i + 1} · ${esc(qs[i].category)} · ${esc(qs[i].whyTheyAsk)}</div>
      <div><b>${esc(s.followUp || s.q)}</b>${s.followUp ? ' <span class="pill">follow-up</span>' : ""}</div>
      ${s.grade ? `<div style="margin-top:6px">${ring(s.grade.score, true)} <span class="hint">${esc(s.grade.weakness)}</span></div>` : ""}
      ${s.grade && s.grade.score >= 8 ? "" : `<textarea data-i="${i}" placeholder="Your answer"></textarea><button data-i="${i}" class="small">Grade answer</button>`}
    </div>`).join("");
  $$("button[data-i]", p).forEach((b) => (b.onclick = async () => {
    const i = +b.dataset.i, s = st[i], answer = $(`textarea[data-i="${i}"]`, p).value.trim();
    if (!answer) return;
    b.disabled = true; b.textContent = "Grading…";
    try {
      const question = s.followUp || s.q;
      const g = await post("/api/spar", { key: DR.key, question, answer, history: s.history });
      s.history += `\nQ: ${question}\nA: ${answer}\nWeakness: ${g.weakness}`;
      s.grade = g; if (g.score < 8) s.followUp = g.followUp;
    } catch (e) { alert(e.message); }
    renderPrep(p);
  }));
}

// ---------- PROFILE ----------
async function renderProfile() {
  try {
    const { profile: p, resume: r } = await get("/api/profile");
    $("#profileBody").innerHTML = `<div class="promise">🛡 Everything the agent writes or answers comes from this profile and résumé. If a question can't be answered from them, it stops and asks you.</div>
      <div class="card"><dl>
        <dt>Name</dt><dd>${esc(p.firstName)} ${esc(p.lastName)}</dd>
        <dt>Contact</dt><dd>${esc(p.email)} · ${esc(p.phone)}</dd>
        <dt>Location</dt><dd>${esc(p.city)}, ${esc(p.region)}, ${esc(p.country)}</dd>
        <dt>Work authorization</dt><dd>${esc(p.workAuthorization.authorizedCountries.join(", "))} · sponsorship needed: ${p.workAuthorization.requiresSponsorship ? "yes" : "no"}</dd>
        <dt>Salary</dt><dd>floor ${esc(p.salary.floor.toLocaleString())} ${esc(p.salary.currency)} · forms get “${esc(p.salary.expected)}”</dd>
        <dt>Search rules</dt><dd>${p.search.remoteOnly ? "remote only" : "any work mode"}${p.search.acceptableLocations.length ? ` (also ${esc(p.search.acceptableLocations.join(", "))})` : ""} · skip ${esc(p.search.excludeEmploymentTypes.join(", "))}</dd>
        <dt>Apply-to-all</dt><dd>fit ≥ ${p.automation.scoreThreshold} · max ${p.automation.dailyCap}/day · notice ${esc(p.automation.noticePeriod)}</dd>
        <dt>Saved answers</dt><dd>${Object.entries(p.answers).map(([k, v]) => `“${esc(k)}” → ${esc(v)}`).join("<br>") || "—"}</dd>
      </dl></div>
      <div class="card" style="margin-top:14px"><h3>${esc(r.name)}</h3><div class="hint">${esc(r.contact)}</div><p>${esc(r.summary)}</p>
        <div class="hint">${r.roles.map((x) => `${esc(x.heading)} · ${x.bullets} bullets`).join("<br>")}</div></div>
      <p class="hint">To change these, edit <code>config/profile.yaml</code> and <code>config/resume.md</code>, then restart.</p>`;
  } catch (e) { $("#profileBody").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// ---------- boot ----------
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-open]");
  if (a) { e.preventDefault(); location.hash = "#applications"; setTimeout(() => openDrawer(a.dataset.open), 60); }
});
loadConfig().catch(() => {});
refreshApps();
show(location.hash.slice(1) || "find");
$("#q").focus();
</script>
